name: CD Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      skip_build:
        description: '跳过服务器端构建步骤 (仅重启服务)'
        type: boolean
        default: false
        required: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Create .env from example
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          cp .env.example apps/homepage/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all tests
        run: pnpm test

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            cd /opt/home
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_build }}" = "true" ]; then
              bash deploy.sh --skip-build
            else
              bash deploy.sh
            fi
