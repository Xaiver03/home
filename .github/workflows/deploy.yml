name: CD Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      skip_build:
        description: '跳过构建步骤'
        type: boolean
        default: false
        required: false

jobs:
  # ============================================================
  # Job 1: 构建验证 (与 build.yml 保持一致)
  # ============================================================
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Create .env from example
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          cp .env.example apps/homepage/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build homepage
        run: pnpm --filter homepage build

      - name: Build blog-admin
        run: pnpm --filter blog-admin build

      - name: Build blog-frontend
        run: pnpm --filter blog-frontend build

  # ============================================================
  # Job 2: 部署到服务器
  # ============================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # push 事件已由 on.push.branches 限定为 dev

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/home
            bash scripts/deploy.sh
