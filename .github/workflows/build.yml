name: CI Build Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    name: Build All Apps
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Create .env from example
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          cp .env.example apps/homepage/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build homepage
        run: pnpm --filter homepage build

      - name: Build blog-admin
        run: pnpm --filter blog-admin build

      - name: Build blog-frontend
        run: pnpm --filter blog-frontend build

      - name: Upload homepage artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-dist
          path: apps/homepage/dist
          retention-days: 7

      - name: Upload blog-admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-admin-dist
          path: apps/blog-admin/dist
          retention-days: 7

      - name: Upload blog-frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-frontend-output
          path: apps/blog-frontend/.output
          retention-days: 7
